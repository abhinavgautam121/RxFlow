name: Validate RxFlow
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rxflow
          POSTGRES_PASSWORD: rxflow_local_only
          POSTGRES_DB: rxflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rxflow -d rxflow"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://rxflow:rxflow_local_only@localhost:5432/rxflow
      SEED_ORDERS: '30000'
      ADMIN_API_KEY: ci-only-import-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - name: Migrate, seed, train and validate
        working-directory: backend
        run: |
          alembic upgrade head
          python -m app.bootstrap
          ruff check .
          ruff format --check .
          python -m pytest -q
      - name: Build and test frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start local services for browser acceptance
        run: |
          cd backend
          uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/rxflow-api.log 2>&1 &
          cd ../frontend
          npm run dev -- --port 8080 > /tmp/rxflow-web.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://localhost:8080/ >/dev/null && break || sleep 2; done
      - name: Browser acceptance
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rxflow-evidence
          path: |
            docs/screenshots/*.png
            frontend/playwright-report/
            frontend/test-results/results.json
            backend/artifacts/model_report.json
